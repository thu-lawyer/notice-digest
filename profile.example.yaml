# ============================================================================
# notice-digest 个性化配置样例
# ----------------------------------------------------------------------------
# 用法：cp profile.example.yaml profile.yaml 后按需修改（profile.yaml 已被
# .gitignore 排除；仓库里只保留本样例）。
#
# 优先级：环境变量 > .env > 本文件 > 内置默认值。
# 本文件全部字段都可省略——全部省略时工具仍可零配置运行（用内置默认）。
#
# 两套权重的关系（重要，决定个性化从哪里出发）：
#   weights_prior  = 冷启动先验，也是在线 SGD 的初始值
#   keywords_boost = 关键词侧的起飞加速项
# 运行时学到的权重存在 SQLite 的 weights 表里，**不回写本文件**；
# 本文件只在「初始化 / 重置」时被读入。
# ============================================================================

# 抓取校区：thu = 清华，ruc = 人大（对应站点 URL 路径前缀 /thu/、/ruc/）
campus: thu

# 邮件里最多展示多少条
top_n: 20

# 计划发送时间（仅作展示/自检用；真实触发时间由 systemd timer 决定）
send_at: "07:30"

# 邮件分区顺序（留空则用内置默认）
sections:
  - 今天
  - 明天
  - 本周
  - 讲座活动
  - 文体活动
  - 比赛竞赛
  - 法学
  - AI 相关
  - 其他

# ---------------------------------------------------------------- 收件/发件
# 建议留空，改由 .env 提供（避免把真实地址写进仓库）
to_addr: ""
from_addr: ""

# ---------------------------------------------------------------- SMTP
# 口令（ND_SMTP_PASS）只能来自 .env 或环境变量，本文件不提供该字段。
smtp:
  host: ""          # 例：smtp.qiye.163.com（不要用 smtp.tsinghua.org.cn，证书不匹配）
  port: 465
  user: ""          # 留空则回落到 .env 的 ND_SMTP_USER
  ssl: true

# ---------------------------------------------------------------- 反馈回路
feedback:
  base: ""          # 例：https://<你的域名>；留空则用内置 127.0.0.1:8791（会导致反馈按钮被省略）

# ---------------------------------------------------------------- 路径
paths:
  db_path: ""       # 留空则用 <项目根>/data/notice.db

# ---------------------------------------------------------------- 抓取
fetch:
  timeout: 20       # 单请求超时（秒）
  retries: 3        # 失败重试次数
  pages: 8          # 增量抓取页数（每页固定 30 条）

# ============================================================================
# 个性化先验（冷启动权重）
# ----------------------------------------------------------------------------
# 键的命名规则：
#   cat:<分类>  → 分类级权重（讲座活动/文体活动/社团公益/学术科研/校园动态/学业教务）
#   kw:<关键词> → 关键词级权重
# 数值含义：> 1 表示更想看，< 1 表示更不想看，1.0 为中性。
# 下例体现「文体/讲座/比赛/法学/AI 加权」的产品取向。
# ============================================================================
weights_prior:
  cat:讲座活动: 1.6
  cat:文体活动: 1.2
  cat:社团公益: 0.5
  cat:学术科研: 0.8
  cat:校园动态: 0.15
  cat:学业教务: 0.3
  kw:讲座: 1.0
  kw:论坛: 0.7
  kw:报告: 0.6
  kw:学术: 0.5
  kw:比赛: 1.1
  kw:竞赛: 1.1
  kw:大赛: 1.0
  kw:报名: 0.35
  kw:招募: 0.3
  kw:法学: 1.3
  kw:法律: 1.2
  kw:法治: 1.1
  kw:法学院: 1.4
  kw:宪法: 0.9
  kw:民法: 0.9
  kw:刑法: 0.9
  kw:行政法: 0.9
  kw:AI: 1.2
  kw:人工智能: 1.2
  kw:机器学习: 1.0
  kw:大模型: 1.0
  kw:算法: 0.7
  kw:数据: 0.5
  kw:计算法学: 1.3

# 关键词侧加速项（结构同 weights_prior；省略则等于 weights_prior）
keywords_boost: {}

# 屏蔽词：命中即明显降权（不是硬删除，条目仍可能出现在「其他」区）
keywords_mute:
  - 招聘
  - 宣讲会
  - 夏令营
  - 冬令营
  - 推销
  - 广告
  - 团购
  - 二手

# 来源级加成（按来源名称）
source_boost:
  清华法学院通知: 1.4
  清华大学图书馆培训讲座: 1.0
  清华大学图书馆通知: 0.6
