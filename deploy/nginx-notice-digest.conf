# notice-digest 反馈入口（server 段）→ 安装到 /etc/nginx/sites-enabled/notice-digest.conf
#
# 说明
#  - 本文件是**独立的新 vhost**，不改动既有 lawq / lawq-blog / personal-site / personal-site-memos 四份配置。
#  - 反馈服务只监听 127.0.0.1:8791；公网侧由本 vhost 的 location /nd/ 反代。
#  - 反馈端点自身**没有速率限制**（已知残余项），因此在 nginx 层加 limit_req 兜底。
#    限流区 nd_feedback 定义在 http 段，见同目录 nginx-notice-digest-ratelimit.conf
#    （安装到 /etc/nginx/conf.d/notice-digest-ratelimit.conf）。
#  - 应用对每个请求校验 HMAC 签名，签名不对一律 403（未签名请求同样 403）——
#    nginx 只做限流与透传，不做鉴权。
#
# 部署后自检（不需要公网 DNS）：
#   curl -sS -o /dev/null -w '%{http_code}\n' -H 'Host: nd.thulaw.top' http://127.0.0.1/nd/health
#   curl -sS -o /dev/null -w '%{http_code}\n' -H 'Host: nd.thulaw.top' http://127.0.0.1/nd/f   # 期望 403
#
# 待办（非本任务范围）：nd.thulaw.top 的 DNS 解析与 TLS 证书。未配置前该 vhost 仅在
# 带 Host 头直连 127.0.0.1 时可验证；若需要立刻公网可用，改用已有域名 + 把本 location
# 段 include 进对应 server 块（需改他人配置，须由 owner 决定）。

server {
    listen 80;
    listen [::]:80;
    server_name nd.thulaw.top;

    # 反馈入口：反向代理到本机反馈服务
    location /nd/ {
        # 反馈端点无内置限流（已知残余项）→ nginx 层兜底限流
        limit_req zone=nd_feedback burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;

        # 应用侧依赖这两个头（来源前缀 / UA 判预取）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent        $http_user_agent;

        # 反馈是轻量 GET，超时给短一点，避免占住 worker
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    15s;
    }

    # 未声明的路径不代理，直接 404（本 vhost 只服务反馈入口）
    location / {
        return 404;
    }
}
