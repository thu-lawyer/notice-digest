# notice-digest 反馈入口限流区（http 段）→ 安装到 /etc/nginx/conf.d/notice-digest-ratelimit.conf
#
# 为什么要单独一个文件：limit_req_zone 只允许出现在 http 段，而 location /nd/ 必须出现在
# server 段（见 nginx-notice-digest.conf）。Ubuntu nginx 的 conf.d/*.conf 恰好位于 http 段，
# sites-enabled/* 里的 server 段也在 http 段内，故拆成两个文件即可，互不干扰既有配置。
#
# 反馈端点自身没有速率限制（已知残余项），这里做 IP 级兜底：
#   30 请求/分钟/IP，突发 20，nodelay 表示突发额度内立即放行而不排队。
# 正常人点 👍/👎/链接的频次远低于此；邮件扫描器批量预取会被 429 挡住。

limit_req_zone $binary_remote_addr zone=nd_feedback:10m rate=30r/m;
